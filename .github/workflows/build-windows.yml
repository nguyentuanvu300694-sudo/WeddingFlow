      - name: Extract source archive
        shell: python
        env:
          SOURCE_ARCHIVE: ${{ matrix.archive }}
        run: |
          import os
          from pathlib import Path
          from zipfile import ZipFile

          archive = os.environ["SOURCE_ARCHIVE"]
          files = list(Path(".").glob(Path(archive).stem + "*.zip"))
          assert len(files) == 1, "Upload exactly one matching ZIP: " + archive

          with ZipFile(files[0]) as z:
              z.extractall("source")

          for path in Path("source").rglob("requirements*.txt"):
              content = path.read_text(encoding="utf-8")
              content = content.replace(
                  "opencv-python-headless==4.10.0.94",
                  "opencv-python-headless==4.10.0.84"
              )
              path.write_text(content, encoding="utf-8")
