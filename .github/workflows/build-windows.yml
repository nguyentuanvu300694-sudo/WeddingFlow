name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Extract source ZIP
        run: python -m zipfile -e "WeddingFlow_0.6_Mac_Windows (2).zip" source

      - name: Build WeddingFlow EXE
        working-directory: source/WeddingFlow
        run: python windows_tools.py release

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: WeddingFlow-Windows
          path: source/WeddingFlow/dist/WeddingFlow.exe
          if-no-files-found: error
          retention-days: 14
